# Code style: PEP 8 (https://peps.python.org/pep-0008/)
# Check:        python -m pycodestyle <files>
# Format:       python -m black <files> && python -m isort <files>
#               (black settings in pyproject.toml)

[pycodestyle]
max-line-length = 79
max-doc-length = 72
# E203 (space before ':' in slices) and W503 (line break before binary
# operator) contradict PEP 8 itself; black follows PEP 8 there.
ignore = E203,W503

[isort]
profile = black
line_length = 79
known_first_party = config, data, models, rl, training, ws_manager, scheduler,
    alpaca_connector, risk_manager, membership, prices, sources, features
